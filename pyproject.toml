[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-intelligence-radar"
version = "0.1.0"
description = "Radar de inteligência competitiva para a Lorenzetti"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "typer>=0.12",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:app"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["db/migrations/*.mako", "ui/templates/*", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
